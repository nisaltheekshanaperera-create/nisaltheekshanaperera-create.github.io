
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Event Agenda</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #333;
}

h1 {
    text-align: center;
    color: white;
    padding: 20px;
    margin: 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.event {
    background: white;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.event:hover {
    transform: scale(1.02);
}

.event input {
    margin-right: 15px;
    transform: scale(1.3);
}

.done {
    text-decoration: line-through;
    color: gray;
}

#updatesBox {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

#updatesBox h2 {
    margin-top: 0;
}

.update-item {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

input[type="text"] {
    width: 70%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #4facfe;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #007BFF;
}

</style>
</head>

<body>

<h1>🏅 Zee's Avurudu Event Agenda</h1>

<div class="container" id="agenda"></div>

<div class="container" id="updatesBox">
    <h2>📢 Live Updates</h2>
    <div id="updates"></div>
    <input type="text" id="updateInput" placeholder="Type update...">
    <button onclick="addUpdate()">Add</button>
</div>

<script>
const events = [
"වාසනා මුට්ටි - Sasindu, Gayani",
"200M දිවීම - Kavinda, Roshen, Nisal, Sasindu, Dilisha, Thilini, Dewmini",
"සිඟිති පාර්සල් - Thilini, Dewmini",
"අලියට ඇස තැබීම - Vishmitha, Thilini",
"බනිස්කෑම - Vishwa, Dewmini",
"එ්දන්ඩේ යාම - Nimesh",
"ඩෝනි පැනීම - Nisal, Ayesh",
"බැලුම් පිපිරීම - Ranuga, Denuwan",
"පිි පාස්කිරීම - Kavinda, Nimesh, Sasindu, Roshen",
"ඉදිකට්ටටට නුල දැමීම - Dewmini, Kavindu, Ranuga",
"ඩකාට්ටටඩපාර - Chamal, Muditha, Sadeesha, Aresha",
"තුන් පා දිවීම - Sasindu, Roshen, Dewmini",
"අන්ඳයාට ඩයෝ ට්ට කැවීම - Vishwa, Ayesh, Vishmitha, Nimesh",
"බිත්තර ඇල්ීම - Kavinda, Sasindu",
"සංගීත ඩතාප්පපි - Kavinda, Roshen, Kavindu, Nisal",
"කඹ ඇදීම - Chamal, Sadeesha, Aresha",
"පැණි බඹඩර් - All",
"සැඟවුන අමුත්තා - Nethsarani"
];

const agendaDiv = document.getElementById("agenda");

// Load agenda

events.forEach((event, index) => {
    let checked = localStorage.getItem("event_" + index) === "true";

    let div = document.createElement("div");
    div.className = "event";

    let checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = checked;

    let text = document.createElement("span");
    text.innerText = (index + 1) + ") " + event;

    if (checked) text.classList.add("done");

    checkbox.addEventListener("change", () => {
        localStorage.setItem("event_" + index, checkbox.checked);
        text.classList.toggle("done");
    });

    div.appendChild(checkbox);
    div.appendChild(text);
    agendaDiv.appendChild(div);
});

// Updates
function addUpdate() {
    let input = document.getElementById("updateInput");
    let updates = JSON.parse(localStorage.getItem("updates")) || [];

    if (input.value.trim() === "") return;

    updates.push(input.value);
    localStorage.setItem("updates", JSON.stringify(updates));
    input.value = "";
    displayUpdates();
}

function displayUpdates() {
    let div = document.getElementById("updates");
    div.innerHTML = "";

    let updates = JSON.parse(localStorage.getItem("updates")) || [];

    updates.forEach(u => {
        let item = document.createElement("div");
        item.className = "update-item";
        item.innerText = u;
        div.appendChild(item);
    });
}

displayUpdates();

</script>

</body>
</html>
